name: build image

# Builds the controller image for the Raspberry Pi and publishes it
# to GHCR. Watchtower on the Pi follows the rolling tag (rpi-latest)
# and picks up a new digest within its poll interval, so a merge to
# main is enough to roll out — no manual build step.
#
# Runners are x86_64, so arm is built under QEMU emulation. Both
# dependencies are pure Python (nothing compiles), which keeps the
# emulated portion of the build to just pip unpacking files.

on:
  push:
    branches: [main]
    # Only rebuild when something that actually lands in the image
    # changes. core/ and tools/ are not part of it, and config/ and
    # data/ are runtime mounts.
    #
    # This filter is load-bearing, not just a speed optimisation:
    # VERSION/VCS_REF feed image LABELs, so any rebuild produces a
    # new digest and Watchtower would restart a live gate controller
    # for an unrelated docs-only commit.
    paths:
      - 'main.py'
      - 'devices/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yml'

  # Releases are cut by hand rather than by pushing a v* tag. A tag
  # trigger cannot be combined with the paths filter above: path
  # filtering is evaluated against the commits contained in the push,
  # and pushing a tag that points at an already-pushed commit carries
  # no commits, so such a build would silently never run. Dispatching
  # from a tag ref works and is picked up by the version step below.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (default: rpi-v<YYYYMMDD>, or the tag name when run from a tag)'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for pushing to GHCR with the built-in GITHUB_TOKEN;
      # no personal access token needs to be stored as a secret.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name and version
        id: meta
        run: |
          # GHCR rejects uppercase in a reference, and this repo's
          # owner is mixed-case (rohitsingh-parkSmart).
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${owner}/parksmart" >> "$GITHUB_OUTPUT"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="rpi-v$(date -u +%Y%m%d)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.repo }}:rpi-latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          # Reuse layers between runs; without this every build
          # re-runs pip install under emulation.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo ''
            echo '- `${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version }}`'
            echo '- `${{ steps.meta.outputs.repo }}:rpi-latest`'
            echo ''
            echo 'Platforms: `linux/arm64`, `linux/arm/v7`'
          } >> "$GITHUB_STEP_SUMMARY"
